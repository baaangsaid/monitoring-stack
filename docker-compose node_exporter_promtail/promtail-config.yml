server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://172.18.70.113:3100/loki/api/v1/push

scrape_configs:
  # Scrape log dari syslog
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          instance: MGD-PROD-BE-MOSTRACK
          ip: 172.18.69.155
          __path__: /var/log/*.log

  # Scrape log dari Docker containers
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          instance: MGD-PROD-BE-MOSTRACK
          ip: 172.18.69.155
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - labels:
          stream:
      - output:
          source: output
